<!-- Admin Topbar -->
<header class="admin-topbar">
  <div class="admin-topbar__container">
    <!-- Toggle do menu mobile -->
    <button
      class="admin-topbar__toggle"
      (click)="toggleMenu()"
      aria-label="Menu"
      aria-expanded="{{ isMenuOpen }}"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Título da página (placeholder) -->
    <h1 class="admin-topbar__title">Painel Administrativo</h1>

    <!-- Ações do usuário -->
    <div class="admin-topbar__actions">
      <!-- Identificação do operador -->
      <div class="admin-topbar__user">
        <div class="admin-topbar__user-avatar">
          <span>AD</span>
        </div>
        <div class="admin-topbar__user-info">
          <span class="admin-topbar__user-name">Administrador</span>
          <span class="admin-topbar__user-role">Super Admin</span>
        </div>
      </div>

      <!-- Logout -->
      <button
        class="admin-topbar__logout"
        (click)="onLogout()"
        aria-label="Sair"
        title="Sair"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
</header>
